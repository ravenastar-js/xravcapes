name: 🚀 xravcapes - Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🛠️ Checkout repository
        uses: actions/checkout@v6

      - name: ⎔ Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: ⚙️ Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 🔓 Make gradlew executable
        run: chmod +x ./gradlew

      - name: 🔨 Build mod with Gradle
        run: ./gradlew build --stacktrace

      - name: 🔍 Locate built jar(s)
        run: |
          echo "📦 Arquivos gerados em build/libs:"
          ls -la build/libs

      - name: 🏷️ Resolve release version
        id: version
        run: |
          RAW_TAG="${{ github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📋 Versão resolvida: $VERSION"

      - name: 🔐 Generate SHA-256 checksums
        id: checksums
        run: |
          cd build/libs

          MOD_JAR=$(find . -maxdepth 1 -type f -name 'xravcapes-*.jar' \
                    ! -name '*-sources.jar' \
                    ! -name '*-javadoc.jar' \
                    ! -name '*-dev.jar' \
                    | head -n1 | sed 's|^\./||')

          if [ -z "$MOD_JAR" ]; then
            echo "❌ Nenhum jar principal encontrado em build/libs"
            ls -la
            exit 1
          fi

          MOD_SHA=$(sha256sum "$MOD_JAR" | awk '{print $1}')
          echo "mod_jar=$MOD_JAR" >> "$GITHUB_OUTPUT"
          echo "mod_sha=$MOD_SHA" >> "$GITHUB_OUTPUT"

          echo "📦 Mod principal: $MOD_JAR"
          echo "🔐 SHA-256: $MOD_SHA"

          sha256sum *.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 📝 Generate release body file
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MOD_JAR: ${{ steps.checksums.outputs.mod_jar }}
          MOD_SHA: ${{ steps.checksums.outputs.mod_sha }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p .github/release

          {
            printf '%s\n' "## 🚀 XRAV CAPES publicado!"
            printf '\n'
            printf '%s\n' '**🧥 Mod client-side para Fabric (Minecraft `1.21.11`) que exibe capas do OptiFine e capas nativas/padrão do Minecraft, sem precisar do OptiFine instalado.**'
            printf '\n---\n\n'

            printf '%s\n' "## ⬇️ Download direto"
            printf '\n'
            printf '%s\n' "**[📥 Clique aqui para baixar o xravcapes-${VERSION}.jar](https://github.com/ravenastar-js/xravcapes/releases/download/v${VERSION}/xravcapes-${VERSION}.jar)**"
            printf '\n'

            printf '```\n'
            printf '%s\n' "https://github.com/ravenastar-js/xravcapes/releases/download/v${VERSION}/xravcapes-${VERSION}.jar"
            printf '```\n'
            printf '\n---\n\n'

            printf '%s\n' "## 📥 Como instalar (LEIA COM ATENÇÃO)"
            printf '\n'
            printf '%s\n' "1. **Baixe apenas** o arquivo:"
            printf '   ```\n'
            printf '   %s\n' "xravcapes-${VERSION}.jar"
            printf '   ```\n'
            printf '%s\n' "2. Abra a pasta de mods do Minecraft. No Windows, pressione \`Win + R\`, cole o caminho abaixo e aperte **Enter**:"
            printf '   ```\n'
            printf '   %s\n' '%appdata%\.minecraft\mods'
            printf '   ```\n'
            printf '   > 💡 Se a pasta `mods` não existir, crie-a manualmente dentro de `.minecraft`.\n'
            printf '%s\n' "3. Coloque o arquivo \`xravcapes-${VERSION}.jar\` dentro da pasta \`mods\`."
            printf '%s\n' '4. Inicie o Minecraft com o **Fabric Loader** (versão `>= 0.18.0`) e o **[Fabric API](https://modrinth.com/mod/fabric-api)** instalado.'
            printf '\n---\n\n'

            printf '%s\n' "## ⚠️ AVISO IMPORTANTE — NÃO FAÇA ISSO"
            printf '\n'
            printf '%s\n' "❌ **NÃO baixe nem coloque o arquivo \`xravcapes-${VERSION}-sources.jar\` na pasta \`mods\`.**"
            printf '\n'
            printf '%s\n' 'O arquivo `-sources.jar` contém **apenas o código-fonte** para desenvolvedores e **NÃO é um mod funcional**. Se você colocá-lo na pasta `mods`:'
            printf '%s\n' '- O Minecraft **não vai carregar o mod**;'
            printf '%s\n' '- O jogo pode apresentar **erros ou travar**;'
            printf '%s\n' '- Nada funcionará como esperado.'
            printf '\n'
            printf '%s\n' "✅ Use **somente** o \`xravcapes-${VERSION}.jar\`."
            printf '\n---\n\n'

            printf '%s\n' "## 🔐 Verificação de integridade (SHA-256)"
            printf '\n'
            printf '%s\n' 'Para garantir que o download não foi corrompido, compare o hash do arquivo baixado com o valor abaixo:'
            printf '\n'
            printf '```\n'
            printf 'Arquivo: %s\n' "${MOD_JAR}"
            printf 'SHA-256: %s\n' "${MOD_SHA}"
            printf '```\n'
            printf '\n'
            printf '%s\n' '**Como verificar no Windows (PowerShell):**'
            printf '```powershell\n'
            printf '%s\n' "Get-FileHash .\\xravcapes-${VERSION}.jar -Algorithm SHA256"
            printf '```\n'
            printf '\n'
            printf '%s\n' '**Como verificar no Linux/macOS:**'
            printf '```bash\n'
            printf '%s\n' "sha256sum xravcapes-${VERSION}.jar"
            printf '```\n'
            printf '\n'
            printf '%s\n' '> 📄 O arquivo `SHA256SUMS.txt` também está anexado à release, contendo os hashes de **todos** os jars gerados.'
            printf '\n---\n\n'

            printf '%s\n' "## 🥇 Hierarquia de prioridade das capas"
            printf '\n'
            printf '%s\n' '| Fonte | Score |'
            printf '%s\n' '|---|---|'
            printf '%s\n' '| 🧡 Capa do OptiFine | **1.0** |'
            printf '%s\n' '| 💚 Capa padrão/original do Minecraft | **0.9** |'
            printf '%s\n' '| 🔵 Outras capas (fonte customizada) | **0.8** |'
            printf '\n---\n\n'

            printf '%s\n' "## 🔗 Links úteis"
            printf '\n'
            printf '%s\n' "- **📥 [Download direto — xravcapes-${VERSION}.jar](https://github.com/ravenastar-js/xravcapes/releases/download/v${VERSION}/xravcapes-${VERSION}.jar)**"
            printf '%s\n' '- **💻 [Código-fonte](https://github.com/ravenastar-js/xravcapes)**'
            printf '%s\n' '- **🧵 [Fabric API (Modrinth)](https://modrinth.com/mod/fabric-api)**'
            printf '\n---\n\n'

            printf '%s\n' "**🌱 Versão:** ${VERSION}"
            printf '%s\n' "**🔖 Tag:** ${TAG}"
            printf '%s\n' '**🎮 Minecraft:** `1.21.11` (Fabric Loader `>= 0.18.0`)'
            printf '%s\n' '**⚡ Publicado automaticamente via GitHub Actions**'
            printf '\n'
            printf '%s\n' '> 🎯 **Uso:** exibir capas do OptiFine e do Minecraft no client, sem depender do OptiFine instalado.'
          } > .github/release/body.md

          echo "📄 Body gerado:"
          echo "----------------------------------------"
          cat .github/release/body.md
          echo "----------------------------------------"

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: xravcapes-jar
          path: |
            build/libs/*.jar
            build/libs/SHA256SUMS.txt
          if-no-files-found: error

      - name: 🎉 Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/${{ steps.checksums.outputs.mod_jar }}
            build/libs/xravcapes-${{ steps.version.outputs.version }}-sources.jar
            build/libs/SHA256SUMS.txt
          name: "🌱 v${{ steps.version.outputs.version }}"
          body_path: .github/release/body.md
          draft: false
          prerelease: false
