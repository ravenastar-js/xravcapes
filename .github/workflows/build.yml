name: 🚀 xravcapes - Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🛠️ Checkout repository
        uses: actions/checkout@v6

      - name: ⎔ Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: ⚙️ Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 🔓 Make gradlew executable
        run: chmod +x ./gradlew

      - name: 🔨 Build mod with Gradle
        run: ./gradlew build --stacktrace

      - name: 🔍 Locate built jar(s)
        run: |
          echo "📦 Arquivos gerados em build/libs:"
          ls -la build/libs

      - name: 🏷️ Resolve release version
        id: version
        run: |
          RAW_TAG="${{ github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📋 Versão resolvida: $VERSION"

      - name: 🔐 Generate SHA-256 checksums
        id: checksums
        run: |
          cd build/libs

          MOD_JAR=$(find . -maxdepth 1 -type f -name 'xravcapes-*.jar' \
                    ! -name '*-sources.jar' \
                    ! -name '*-javadoc.jar' \
                    ! -name '*-dev.jar' \
                    | head -n1 | sed 's|^\./||')

          if [ -z "$MOD_JAR" ]; then
            echo "❌ Nenhum jar principal encontrado em build/libs"
            ls -la
            exit 1
          fi

          MOD_SHA=$(sha256sum "$MOD_JAR" | awk '{print $1}')
          echo "mod_jar=$MOD_JAR" >> "$GITHUB_OUTPUT"
          echo "mod_sha=$MOD_SHA" >> "$GITHUB_OUTPUT"

          echo "📦 Mod principal: $MOD_JAR"
          echo "🔐 SHA-256: $MOD_SHA"

          sha256sum *.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 📝 Generate release body file
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MOD_JAR: ${{ steps.checksums.outputs.mod_jar }}
          MOD_SHA: ${{ steps.checksums.outputs.mod_sha }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p .github/release

          cat > .github/release/body.md <<EOF
          ## 🚀 XRAV CAPES publicado!

          **🧥 Mod client-side para Fabric (Minecraft \`1.21.11\`) que exibe capas do OptiFine e capas nativas/padrão do Minecraft, sem precisar do OptiFine instalado.**

          ---

          ## ⬇️ Download direto

          **[📥 Clique aqui para baixar o xravcapes-${VERSION}.jar](https://github.com/ravenastar-js/xravcapes/releases/download/v${VERSION}/xravcapes-${VERSION}.jar)**

          ```
          https://github.com/ravenastar-js/xravcapes/releases/download/v${VERSION}/xravcapes-${VERSION}.jar
          ```

          ---

          ## 📥 Como instalar (LEIA COM ATENÇÃO)

          1. **Baixe apenas** o arquivo:
             ```
             xravcapes-${VERSION}.jar
             ```
          2. Abra a pasta de mods do Minecraft. No Windows, pressione \`Win + R\`, cole o caminho abaixo e aperte **Enter**:
             ```
             %appdata%\.minecraft\mods
             ```
             > 💡 Se a pasta \`mods\` não existir, crie-a manualmente dentro de \`.minecraft\`.
          3. Coloque o arquivo \`xravcapes-${VERSION}.jar\` dentro da pasta \`mods\`.
          4. Inicie o Minecraft com o **Fabric Loader** (versão \`>= 0.18.0\`) e o **[Fabric API](https://modrinth.com/mod/fabric-api)** instalado.

          ---

          ## ⚠️ AVISO IMPORTANTE — NÃO FAÇA ISSO

          ❌ **NÃO baixe nem coloque o arquivo \`xravcapes-${VERSION}-sources.jar\` na pasta \`mods\`.**

          O arquivo \`-sources.jar\` contém **apenas o código-fonte** para desenvolvedores e **NÃO é um mod funcional**. Se você colocá-lo na pasta \`mods\`:
          - O Minecraft **não vai carregar o mod**;
          - O jogo pode apresentar **erros ou travar**;
          - Nada funcionará como esperado.

          ✅ Use **somente** o \`xravcapes-${VERSION}.jar\`.

          ---

          ## 🔐 Verificação de integridade (SHA-256)

          Para garantir que o download não foi corrompido, compare o hash do arquivo baixado com o valor abaixo:

          ```
          Arquivo: ${MOD_JAR}
          SHA-256: ${MOD_SHA}
          ```

          **Como verificar no Windows (PowerShell):**
          ```powershell
          Get-FileHash .\xravcapes-${VERSION}.jar -Algorithm SHA256
          ```

          **Como verificar no Linux/macOS:**
          ```bash
          sha256sum xravcapes-${VERSION}.jar
          ```

          > 📄 O arquivo \`SHA256SUMS.txt\` também está anexado à release, contendo os hashes de **todos** os jars gerados.

          ---

          ## 🥇 Hierarquia de prioridade das capas

          | Fonte | Score |
          |---|---|
          | 🧡 Capa do OptiFine | **1.0** |
          | 💚 Capa padrão/original do Minecraft | **0.9** |
          | 🔵 Outras capas (fonte customizada) | **0.8** |

          ---

          ## 🔗 Links úteis

          - **📥 [Download direto — xravcapes-${VERSION}.jar](https://github.com/ravenastar-js/xravcapes/releases/download/v${VERSION}/xravcapes-${VERSION}.jar)**
          - **💻 [Código-fonte](https://github.com/ravenastar-js/xravcapes)**
          - **🧵 [Fabric API (Modrinth)](https://modrinth.com/mod/fabric-api)**

          ---

          **🌱 Versão:** ${VERSION}
          **🔖 Tag:** ${TAG}
          **🎮 Minecraft:** \`1.21.11\` (Fabric Loader \`>= 0.18.0\`)
          **⚡ Publicado automaticamente via GitHub Actions**

          > 🎯 **Uso:** exibir capas do OptiFine e do Minecraft no client, sem depender do OptiFine instalado.
          EOF

          echo "📄 Body gerado:"
          echo "----------------------------------------"
          cat .github/release/body.md
          echo "----------------------------------------"

          if [ ! -s .github/release/body.md ]; then
            echo "❌ ERRO: body.md está vazio!"
            exit 1
          fi

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: xravcapes-jar
          path: |
            build/libs/*.jar
            build/libs/SHA256SUMS.txt
          if-no-files-found: error

      - name: 🎉 Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "🌱 v${{ steps.version.outputs.version }}" \
            --notes-file .github/release/body.md \
            "build/libs/${{ steps.checksums.outputs.mod_jar }}" \
            "build/libs/xravcapes-${{ steps.version.outputs.version }}-sources.jar" \
            "build/libs/SHA256SUMS.txt"