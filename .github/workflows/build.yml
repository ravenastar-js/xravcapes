name: 🚀 xravcapes - Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🛠️ Checkout repository
        uses: actions/checkout@v6

      - name: ⎔ Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: ⚙️ Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 🔓 Make gradlew executable
        run: chmod +x ./gradlew

      - name: 🔨 Build mod with Gradle
        run: ./gradlew build --stacktrace

      - name: 🔍 Locate built jar(s)
        run: |
          echo "📦 Arquivos gerados em build/libs:"
          ls -la build/libs

      - name: 🏷️ Resolve release version
        id: version
        run: |
          RAW_TAG="${{ github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📋 Versão resolvida: $VERSION"

      - name: 🔐 Generate SHA-256 checksums
        id: checksums
        run: |
          cd build/libs

          MOD_JAR=$(find . -maxdepth 1 -type f -name 'xravcapes-*.jar' \
                    ! -name '*-sources.jar' \
                    ! -name '*-javadoc.jar' \
                    ! -name '*-dev.jar' \
                    | head -n1 | sed 's|^\./||')

          if [ -z "$MOD_JAR" ]; then
            echo "❌ Nenhum jar principal encontrado em build/libs"
            ls -la
            exit 1
          fi

          MOD_SHA=$(sha256sum "$MOD_JAR" | awk '{print $1}')
          echo "mod_jar=$MOD_JAR" >> "$GITHUB_OUTPUT"
          echo "mod_sha=$MOD_SHA" >> "$GITHUB_OUTPUT"

          echo "📦 Mod principal: $MOD_JAR"
          echo "🔐 SHA-256: $MOD_SHA"

          sha256sum *.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 📝 Generate release body file
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MOD_JAR: ${{ steps.checksums.outputs.mod_jar }}
          MOD_SHA: ${{ steps.checksums.outputs.mod_sha }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p .github/release

          cat > .github/release/body.md <<EOF
          ## 🚀 XRAV CAPES published!

          **🧥 Client-side mod for Fabric (Minecraft \`1.21.11\`) that displays OptiFine capes and Minecraft's native/default capes, without needing OptiFine installed.**

          ---

          ## ⬇️ Direct download

          **[📥 Click here to download xravcapes-${VERSION}.jar](https://github.com/ravenastar-js/xravcapes/releases/download/v${VERSION}/xravcapes-${VERSION}.jar)**

          \`\`\`
          https://github.com/ravenastar-js/xravcapes/releases/download/v${VERSION}/xravcapes-${VERSION}.jar
          \`\`\`

          ---

          ## 📥 How to install (READ CAREFULLY)

          1. **Download only** the file:
             \`\`\`
             xravcapes-${VERSION}.jar
             \`\`\`
          2. Open your Minecraft mods folder. On Windows, press \`Win + R\`, paste the path below, and hit **Enter**:
             \`\`\`
             %appdata%\.minecraft\mods
             \`\`\`
             > 💡 If the \`mods\` folder doesn't exist, create it manually inside \`.minecraft\`.
          3. Place the file \`xravcapes-${VERSION}.jar\` inside the \`mods\` folder.
          4. Launch Minecraft with **Fabric Loader** (version \`>= 0.18.0\`) and **[Fabric API](https://modrinth.com/mod/fabric-api)** installed.

          ---

          ## ⚠️ IMPORTANT WARNING — DO NOT DO THIS

          ❌ **DO NOT download or place the file \`xravcapes-${VERSION}-sources.jar\` in the \`mods\` folder.**

          The \`-sources.jar\` file contains **only the source code** for developers and is **NOT a functional mod**. If you place it in the \`mods\` folder:
          - Minecraft **will not load the mod**;
          - The game may show **errors or crash**;
          - Nothing will work as expected.

          ✅ Use **only** \`xravcapes-${VERSION}.jar\`.

          ---

          ## 🔐 Integrity verification (SHA-256)

          To make sure the download wasn't corrupted, compare the hash of the downloaded file with the value below:

          \`\`\`
          File: ${MOD_JAR}
          SHA-256: ${MOD_SHA}
          \`\`\`

          **How to verify on Windows (PowerShell):**
          \`\`\`powershell
          Get-FileHash .\xravcapes-${VERSION}.jar -Algorithm SHA256
          \`\`\`

          **How to verify on Linux/macOS:**
          \`\`\`bash
          sha256sum xravcapes-${VERSION}.jar
          \`\`\`

          > 📄 The \`SHA256SUMS.txt\` file is also attached to the release, containing the hashes of **all** generated jars.

          ---

          ## 🥇 Cape priority hierarchy

          | Source | Score |
          |---|---|
          | 🧡 OptiFine cape | **1.0** |
          | 💚 Minecraft default/original cape | **0.9** |
          | 🔵 Other capes (custom source) | **0.8** |

          ---

          ## 🔗 Useful links

          - **📥 [Direct download — xravcapes-${VERSION}.jar](https://github.com/ravenastar-js/xravcapes/releases/download/v${VERSION}/xravcapes-${VERSION}.jar)**
          - **💻 [Source code](https://github.com/ravenastar-js/xravcapes)**
          - **🧵 [Fabric API (Modrinth)](https://modrinth.com/mod/fabric-api)**

          ---

          **🌱 Version:** ${VERSION}
          **🔖 Tag:** ${TAG}
          **🎮 Minecraft:** \`1.21.11\` (Fabric Loader \`>= 0.18.0\`)
          **⚡ Automatically published via GitHub Actions**

          > 🎯 **Usage:** display OptiFine and Minecraft capes on the client, without depending on OptiFine.
          EOF

          echo "📄 Body gerado:"
          echo "----------------------------------------"
          cat .github/release/body.md
          echo "----------------------------------------"

          if [ ! -s .github/release/body.md ]; then
            echo "❌ ERRO: body.md está vazio!"
            exit 1
          fi

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: xravcapes-jar
          path: |
            build/libs/*.jar
            build/libs/SHA256SUMS.txt
          if-no-files-found: error

      - name: 🎉 Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "🌱 v${{ steps.version.outputs.version }}" \
            --notes-file .github/release/body.md \
            "build/libs/${{ steps.checksums.outputs.mod_jar }}" \
            "build/libs/xravcapes-${{ steps.version.outputs.version }}-sources.jar" \
            "build/libs/SHA256SUMS.txt"
